# Project-wide Gradle settings.

# Run the Gradle daemon with more heap for AGP/Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the AndroidX package structure (required by all current AGP versions).
android.useAndroidX=true

# Kotlin code style used by IDE formatters that read this file.
kotlin.code.style=official

# Enables namespacing of each library's R class so unrelated app resources
# aren't visible to a given module's R class.
android.nonTransitiveRClass=true

# Run Gradle tasks in parallel where the task graph allows it.
org.gradle.parallel=true

# Enable the Gradle build cache for faster incremental builds.
org.gradle.caching=true
