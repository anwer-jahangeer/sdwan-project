name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "android_multilink_manager/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android_multilink_manager/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android_multilink_manager

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multilink-manager-android-debug
          path: android_multilink_manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            android_multilink_manager/app/build/reports/tests/
            android_multilink_manager/app/build/reports/lint-results-debug.html
            android_multilink_manager/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
